[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-importer"
version = "0.1.0"
description = "Laboratory work 5: error handling, files and serialization"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
reliable-importer = "reliable_importer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
